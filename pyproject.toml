[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server for Garmin Connect: sleep, HRV, Body Battery, training readiness, activities, FIT analysis and workouts for Claude and other MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Andersson" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "garmin",
    "garmin-connect",
    "claude",
    "fitness",
    "health",
    "hrv",
    "running",
    "cycling",
    "fit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect>=0.3.17,<0.4",
    "mcp>=2.3,<3",
    "garmin-fit-sdk>=21.218,<22",
    "curl_cffi>=0.15",
    "anyio>=4.5",
    "pydantic>=2.7",
    "tzdata>=2025.1",
]

[project.urls]
Homepage = "https://github.com/wiande00/garmin-mcp"
Issues = "https://github.com/wiande00/garmin-mcp/issues"
Changelog = "https://github.com/wiande00/garmin-mcp/blob/main/CHANGELOG.md"

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
